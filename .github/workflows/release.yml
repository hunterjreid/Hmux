# Publish a release, either from a version tag or from any push to master.
#
#   git push                          -> 0.1.<run number>, tagged and released
#   git tag v0.2.0 && git push --tags -> 0.2.0, exactly as written
#
# Every push releasing something is what makes the in-app updater work at all.
# The window compares its own version against the newest release on GitHub, so
# a repository with no releases in it can never offer one, and that is not a bug
# anyone can see from inside the app: `checkForUpdate` treats the 404 as "you
# are up to date" and says nothing. Cutting a release by hand was therefore a
# step that could be forgotten silently and for months.
#
# The patch number is the workflow's own run number rather than a count of
# commits or a date. It only ever goes up, it cannot repeat after a history
# rewrite, and it survives two pushes landing in the same minute — all three of
# which matter, because the updater's comparison is numeric and a version that
# ever goes backwards is one that offers a downgrade forever.
#
# The major and minor come from Cargo.toml, so bumping either is still done in
# the file and the tag follows. Nothing here writes them back to the repository:
# the stamped files exist only inside the build, since committing a version bump
# from a workflow that runs on push is how you get a workflow that triggers
# itself.
#
# Produces five assets. The three bare executables are what install.ps1
# fetches; the installers are for people who would rather click something.
#
#   hmux-gui.exe              the window
#   hmux.exe                  the console version
#   hmux-daemon.exe           the process that owns the terminals
#   hmux-setup-<version>.exe  NSIS installer
#   hmux-<version>.msi        MSI, for anyone deploying it centrally
#
# hmux-daemon.exe is not optional and its absence does not degrade gracefully:
# install.ps1 lists all three by name and fails outright on a release missing
# any of them. It shipped in the installer before it shipped here, so every
# release cut in between could not be installed at all.

name: release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  # So a failed release can be retried without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true

permissions:
  contents: write

# A push landing while the one before it is still building would otherwise race
# to create a release, and the loser fails on a tag that now exists. Newer wins:
# the older build is already superseded by the code in the newer one.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) {
            $ref = "${{ github.ref }}"
            if ($ref.StartsWith("refs/tags/")) {
              # A tag says exactly what it wants to be called.
              $tag = "${{ github.ref_name }}"
            } else {
              # A branch push names itself. Major and minor are whatever the
              # crate currently claims, so bumping them stays a code change.
              $base = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
                       Select-Object -First 1).Matches[0].Groups[1].Value
              $parts = $base.Split('.')
              $tag = "v$($parts[0]).$($parts[1]).${{ github.run_number }}"
            }
          }
          $version = $tag -replace '^v',''
          "tag=$tag"         >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "building $version as $tag"

      # The app has to agree with the release about what it is called, or the
      # updater never stops offering the update it has already installed:
      # `isNewer` compares the release tag against what `app_version` reports,
      # and a binary still saying 0.1.0 is older than every release forever.
      - name: Stamp the version into the build
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          foreach ($f in @("Cargo.toml", "gui/src-tauri/Cargo.toml")) {
            $text = Get-Content $f -Raw
            # Only the first one, which is the [package] version. A dependency
            # pinned to a version string further down is not ours to rewrite.
            $text = [regex]::Replace($text, '(?m)^version\s*=\s*"[^"]+"', "version = `"$version`"", 1)
            Set-Content $f $text -NoNewline -Encoding utf8
          }

          $f = "gui/src-tauri/tauri.conf.json"
          $text = Get-Content $f -Raw
          $text = [regex]::Replace($text, '"version"\s*:\s*"[^"]+"', "`"version`": `"$version`"", 1)
          Set-Content $f $text -NoNewline -Encoding utf8

          Select-String -Path Cargo.toml, gui/src-tauri/Cargo.toml, gui/src-tauri/tauri.conf.json `
                        -Pattern '"?version"?\s*[:=]\s*"' | Select-Object -First 3

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # `tauri build` only knows about the GUI, so both of the other binaries
      # are built here. The daemon is the one that owns the pseudoconsoles —
      # without it the window opens and cannot start a shell.
      - name: Build the console version and the daemon
        run: cargo build --release --bin hmux --bin hmux-daemon

      # A prebuilt CLI. Building tauri-cli from source here costs more than
      # the rest of this workflow put together.
      - name: Build the window and its installers
        working-directory: gui/src-tauri
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Collect the assets
        id: collect
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $out = "release-assets"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Copy-Item target/release/hmux-gui.exe    $out -ErrorAction Stop
          Copy-Item target/release/hmux.exe        $out -ErrorAction Stop
          Copy-Item target/release/hmux-daemon.exe $out -ErrorAction Stop

          # Tauri names these itself and the pattern has changed between
          # versions, so find them rather than assuming.
          $nsis = Get-ChildItem target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if ($nsis) { Copy-Item $nsis.FullName (Join-Path $out "hmux-setup-$version.exe") }
          else { Write-Host "::warning::no NSIS installer was produced" }

          $msi = Get-ChildItem target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if ($msi) { Copy-Item $msi.FullName (Join-Path $out "hmux-$version.msi") }
          else { Write-Host "::warning::no MSI was produced" }

          Get-ChildItem $out | ForEach-Object {
            "{0,-32} {1,10:N0} bytes" -f $_.Name, $_.Length
          }

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $assets = (Get-ChildItem release-assets).FullName

          # Re-running the workflow for a tag that already has a release should
          # replace its files rather than fall over.
          $exists = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            # `--target` is what creates the tag for a branch push. Without it
            # the release would be cut against the default branch's tip, which
            # is only the same commit until someone pushes twice quickly.
            gh release create $tag @assets `
              --title "hmux $tag" `
              --target "${{ github.sha }}" `
              --generate-notes
          }
