<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mux</title>
    <link rel="stylesheet" href="vendor/xterm.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <!-- Icons are defined once and referenced with <use>, so a button is one
         short element rather than a dozen lines of path data. -->
    <svg class="sprite" aria-hidden="true">
      <!-- The app's own mark: a prompt and the cursor under it, the same two
           colours as the window icon. It carries its own strokes rather than
           taking currentColor, because everything else on that bar is chrome
           and this is the one thing that is not. -->
      <symbol id="i-mark" viewBox="0 0 24 24">
        <path d="M4.75 5.75 11.25 12l-6.5 6.25" fill="none" stroke="#35c47c"
              stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M13.75 18.25h5.5" fill="none" stroke="#4a90f7"
              stroke-width="3" stroke-linecap="round" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 14 14">
        <path d="M7 2.5v9M2.5 7h9" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 14 14">
        <circle cx="6.2" cy="6.2" r="4" />
        <path d="M9.2 9.2 12 12" />
      </symbol>
      <!-- The lobed gear, the same one Cryptoflip uses, rather than the ring
           with spokes that was here. A ring with eight ticks around it reads
           as a loading indicator at sixteen pixels; the lobed outline is the
           shape people already know means settings. -->
      <!--
        Its own stroke width, because it is the only symbol here on a 24-unit
        grid rather than a 16-unit one. `.ico` sets 1.4 for the whole set,
        which is about 1.2 device pixels at the 16 the others use and only 0.8
        at 24 — so this came out visibly thinner and greyer than every icon
        beside it, and the lobes turned to mush. 2 at this scale lands on the
        same weight, which is also Lucide's own default for the grid it drew
        this on.
      -->
      <symbol id="i-gear" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" stroke-width="2" />
        <path stroke-width="2" d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z" />
      </symbol>
      <!-- A divider with the two halves leaving it in opposite directions:
           what the button does, rather than a left-right arrow, which would
           only say "sideways". -->
      <symbol id="i-mirror" viewBox="0 0 16 14">
        <path d="M8 1.5v11" />
        <path d="M5 4.5 2.5 7 5 9.5" />
        <path d="M11 4.5 13.5 7 11 9.5" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 12 12">
        <path d="M2 2 10 10M10 2 2 10" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 12 12">
        <path d="M2 6.4 4.8 9.2 10 3.4" />
      </symbol>
      <!-- A monitor: a screen on a stand. The page beside the terminal is a
           whole display of its own, not a column of the window, and a globe
           would only say "web". -->
      <symbol id="i-panel" viewBox="0 0 16 14">
        <rect x="1" y="1.2" width="14" height="9.2" rx="2" />
        <path d="M8 10.4v1.7" />
        <path d="M5.2 12.5h5.6" />
      </symbol>
      <!-- The profile menu's five. Single-weight strokes on the same 16-unit
           grid as the gear, so a column of them lines up without each one
           needing its own nudge. -->
      <symbol id="i-info" viewBox="0 0 16 16">
        <circle cx="8" cy="8" r="6.2" />
        <path d="M8 7.2v4" />
        <path d="M8 4.9v.1" stroke-linecap="round" stroke-width="1.6" />
      </symbol>
      <symbol id="i-help" viewBox="0 0 16 16">
        <circle cx="8" cy="8" r="6.2" />
        <path d="M6.3 6.1a1.75 1.75 0 1 1 1.75 1.9v1.2" />
        <path d="M8.05 11.4v.1" stroke-linecap="round" stroke-width="1.6" />
      </symbol>
      <!-- A speech bubble with a tail, which is the only thing that
           distinguishes it from the panel icon at this size. -->
      <symbol id="i-feedback" viewBox="0 0 16 16">
        <path d="M13.6 9.4a1.6 1.6 0 0 1-1.6 1.6H6.4L3.5 13.3V4.2a1.6 1.6 0 0 1 1.6-1.6h6.9a1.6 1.6 0 0 1 1.6 1.6z" />
      </symbol>
      <!-- An arrow into a tray: fetching something, rather than the circular
           arrows, which everywhere else in this app mean reload. -->
      <symbol id="i-download" viewBox="0 0 16 16">
        <path d="M8 2.6v6.6" />
        <path d="M5.4 6.9 8 9.4l2.6-2.5" />
        <path d="M3.2 11.4v1.2a.9.9 0 0 0 .9.9h7.8a.9.9 0 0 0 .9-.9v-1.2" />
      </symbol>
      <symbol id="i-back" viewBox="0 0 16 16">
        <path d="M9.6 3.8 5.4 8l4.2 4.2" />
      </symbol>
      <symbol id="i-min" viewBox="0 0 12 12"><path d="M2 6h8" /></symbol>
      <symbol id="i-max" viewBox="0 0 12 12">
        <rect x="2.5" y="2.5" width="7" height="7" rx="1" />
      </symbol>
      <symbol id="i-restore" viewBox="0 0 12 12">
        <rect x="2" y="4" width="6" height="6" rx="1" />
        <path d="M4.5 4V2.5h5.5V8H8.5" />
      </symbol>
    </svg>

    <div class="app">
      <!-- The window's own title bar. The OS one is off, so this carries the
           drag region and the minimise/maximise/close buttons as well as the
           active terminal's name. -->
      <header class="titlebar" id="titlebar">
        <div class="tb-rail">
          <span class="tb-brand" data-drag>
            <svg class="tb-mark" aria-hidden="true"><use href="#i-mark" /></svg>
            <span data-drag>mux</span>
          </span>
          <!-- The page beside the terminal, opened and shut from the corner.
               Up here rather than at the far end of the bar because it is the
               one piece of chrome you reach for constantly, and the corner is
               where the eye already is. -->
          <button class="icon-btn" id="browser-btn" title="Browser sidebar">
            <svg class="ico"><use href="#i-panel" /></svg>
          </button>
        </div>

        <!-- Deliberately empty on the left. The rail already names every
             terminal and marks which one is showing, so repeating the active
             one up here was the same fact twice. -->
        <div class="tb-main" data-drag>
          <span class="spacer" data-drag></span>

          <button class="icon-btn" id="settings-btn" title="Settings">
            <svg class="ico"><use href="#i-gear" /></svg>
          </button>
        </div>

        <!-- Outside both sections on purpose. Swapping sides moves the rail's
             header across the window; the minimise, maximise and close buttons
             are the operating system's convention and stay in the corner they
             belong in whichever way round everything else is. -->
        <div class="win-controls">
          <button class="win-btn" id="win-min" title="Minimise">
            <svg class="ico"><use href="#i-min" /></svg>
          </button>
          <button class="win-btn" id="win-max" title="Maximise">
            <svg class="ico"><use id="win-max-icon" href="#i-max" /></svg>
          </button>
          <button class="win-btn danger" id="win-close" title="Close">
            <svg class="ico"><use href="#i-close" /></svg>
          </button>
        </div>
      </header>

      <!-- Left: the terminal rail -->
      <aside class="rail">
        <!-- Search and new-terminal, together. Both are things you do TO the
             list, so they belong at the top of it rather than in the window's
             title bar. The search is a button until you want it. -->
        <div class="rail-head" id="rail-head">
          <button class="icon-btn rail-search-btn" id="filter-btn" title="Search terminals">
            <svg class="ico"><use href="#i-search" /></svg>
          </button>
          <input id="filter" placeholder="Search" spellcheck="false" />
          <button class="icon-btn" id="new-btn" title="New terminal">
            <svg class="ico"><use href="#i-plus" /></svg>
          </button>
        </div>

        <div class="rail-list" id="list"></div>
      </aside>

      <div class="split" id="split-term"></div>

      <!-- Middle: the active terminal. No header of its own — the title bar
           above already names it, and a second strip saying the same thing
           would be chrome for its own sake. -->
      <main class="term-panel">
        <div class="term-host" id="term-host"></div>
      </main>

      <div class="split" id="split-browser"></div>

      <!-- Right: a real browser webview lives on top of #browser-slot -->
      <section class="browser-panel chrome-hidden" id="browser-panel">
        <!-- The open pages. Above the address bar, because the bar describes
             whichever of these is selected. -->
        <div class="tabstrip" id="tabstrip">
          <div class="tabs" id="tabs"></div>
          <button class="icon-btn tab-new" id="tab-new" title="New tab">
            <svg class="ico"><use href="#i-plus" /></svg>
          </button>
        </div>

        <!-- Collapsed to a hover strip by default; see .chrome-hidden. -->
        <header class="browser-bar" id="browser-bar"
                title="Address bar — Ctrl+Shift+L">
          <button class="icon-btn" id="back-btn" title="Back">‹</button>
          <button class="icon-btn" id="fwd-btn" title="Forward">›</button>
          <button class="icon-btn" id="reload-btn" title="Reload">⟳</button>
          <input id="url" class="url-input" spellcheck="false"
                 placeholder="Search or enter address" />
          <!-- Closing the panel belongs on the panel. The title bar's toggle
               opens it and then hides itself, because a control that opened a
               thing is not where anyone looks to shut it. -->
          <button class="icon-btn" id="browser-close" title="Close browser">
            <svg class="ico"><use href="#i-close" /></svg>
          </button>
          <!-- Overlaid on the bar rather than placed under it. A strip that
               took up its own height would move the slot below, and the native
               browser is positioned over that slot's rectangle - so every page
               that started loading would resize the page that was loading. -->
          <div class="browser-progress" id="browser-progress" hidden></div>
        </header>
        <!-- Deliberately empty: the native browser webview is positioned over
             this element's rectangle. Nothing drawn here would be visible. -->
        <div class="browser-slot" id="browser-slot"></div>
      </section>
    </div>

    <!-- Right-click a terminal in the rail. Built and positioned at the
         pointer, so it lives at the top level rather than inside a row that
         gets thrown away on the next repaint. -->
    <div class="menu context" id="row-menu" hidden></div>
    <div class="menu settings" id="settings-menu" hidden></div>

    <!-- An update that has already been downloaded, asking to be let in. Over
         everything including the native browsers, which is the reason it is a
         full-window scrim rather than a panel: a webview cannot be covered by
         chrome, so the only way to sit above one is to have it moved out of
         the way, which `update_apply` does by ending the process. -->
    <div class="update-scrim" id="update-modal" hidden></div>

    <!-- Failures used to be invisible: a terminal would exist but never show
         up, with the reason only in a console nobody can open. -->
    <div class="errbar" id="err" hidden>
      <span id="err-text"></span>
      <button class="icon-btn" id="err-close">
        <svg class="ico"><use href="#i-close" /></svg>
      </button>
    </div>

    <script src="vendor/xterm.js"></script>
    <script src="vendor/addon-fit.js"></script>
    <script src="vendor/addon-web-links.js"></script>
    <script src="vendor/addon-serialize.js"></script>
    <script src="app.js"></script>
  </body>
</html>
