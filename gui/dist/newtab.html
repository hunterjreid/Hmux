<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New tab</title>
    <style>
      /* Loaded into a browser webview with no access to the app's API, so this
         page is entirely self-contained: plain HTML, CSS and a form. */
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        /* The app's chrome colour, not the terminal's black. This page sits
           edge to edge with a terminal, and matching it made a browser with
           nothing open look like more terminal. Keep in step with `--browser`
           in app.css. */
        background: #272727;
        color: #c5c8c6;
        font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        padding: 24px;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 26px;
        font-weight: 650;
        letter-spacing: -0.01em;
        color: #c5c8c6;
      }
      .mark .caret {
        color: #6a7ec8;
        font-family: "Cascadia Mono", Consolas, monospace;
      }
      form {
        width: min(620px, 100%);
        display: flex;
        gap: 8px;
      }
      input {
        flex: 1;
        min-width: 0;
        height: 46px;
        padding: 0 18px;
        border-radius: 23px;
        /* Same lift over the surface as the rail's search box, so the two
           read as the same kind of control. */
        border: 1px solid #4e4e4e;
        background: #3c3c3c;
        color: inherit;
        font: inherit;
        font-size: 15px;
        outline: none;
        transition: border-color 0.15s, background 0.15s;
      }
      input::placeholder {
        color: #767676;
      }
      input:focus {
        border-color: #6a7ec8;
        background: #4e4e4e;
      }
      button {
        height: 46px;
        padding: 0 22px;
        border-radius: 23px;
        border: none;
        background: #6a7ec8;
        color: #1e1e1e;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }
      button:hover {
        background: #819aff;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        width: min(620px, 100%);
      }
      .links a {
        padding: 8px 14px;
        border: 1px solid #3a3a3a;
        border-radius: 999px;
        background: #3c3c3c;
        color: #9b9e9c;
        text-decoration: none;
        font-size: 12.5px;
        transition: color 0.15s, border-color 0.15s, background 0.15s;
      }
      .links a:hover {
        color: #c5c8c6;
        border-color: #5f5f5f;
        background: #4e4e4e;
      }
      .hint {
        color: #767676;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"><span class="caret">&gt;_</span> hmux</div>

      <!-- No JS needed: the form GETs straight to the search engine. -->
      <form action="https://duckduckgo.com/" method="GET">
        <input
          name="q"
          type="text"
          autofocus
          spellcheck="false"
          autocomplete="off"
          placeholder="Search the web"
        />
        <button type="submit">Search</button>
      </form>

      <nav class="links">
        <a href="https://github.com">GitHub</a>
        <a href="https://docs.rs">docs.rs</a>
        <a href="https://crates.io">crates.io</a>
        <a href="https://developer.mozilla.org">MDN</a>
        <a href="https://news.ycombinator.com">Hacker News</a>
        <a href="https://stackoverflow.com">Stack Overflow</a>
      </nav>

      <p class="hint">This browser belongs to the selected terminal.</p>
    </main>
  </body>
</html>
