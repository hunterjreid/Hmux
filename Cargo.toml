[package]
name = "mux"
version = "0.1.0"
edition = "2024"

# The GUI front end is a second crate that shares this one's pty layer.
[workspace]
members = ["gui/src-tauri"]

[[bin]]
name = "mux"
path = "src/main.rs"

# The process that outlives the window. See src/daemon.rs.
[[bin]]
name = "mux-daemon"
path = "src/bin/mux-daemon.rs"

[dependencies]
anyhow = "1.0.104"
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2.2"
vte = "0.15.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    # Reading another process's working directory: open it, resolve
    # NtQueryInformationProcess out of ntdll, read its PEB. See src/cwd.rs.
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    # The daemon's front door: a named pipe, one instance per connected client.
    "Win32_System_Pipes",
    "Win32_Security",
    # Right-click copy and paste. The webview's own clipboard API refuses
    # whenever the calling document is not focused; see src/clipboard.rs.
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }
